<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827">
<title>BizFlow — Gestion d'entreprise</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--text:#172033;--muted:#788397;--line:#e7ebf2;--accent:#5869e8;--accent2:#16a78b;--danger:#e45668;--warning:#e5a33c;--shadow:0 8px 24px rgba(20,32,55,.055);--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:248px;background:#111a2b;color:#eaf0fc;position:fixed;inset:0 auto 0 0;padding:22px 14px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:4px 9px 24px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,#6476ff,#3b50d9);display:grid;place-items:center;font-size:20px;font-weight:800;box-shadow:0 5px 16px #3546a855}.brandname{font-weight:800;font-size:18px;letter-spacing:.2px}.brandname small{display:block;color:#93a3c2;font-weight:500;font-size:10px;letter-spacing:1.4px}.nav-label{color:#71819f;font-size:10px;font-weight:800;letter-spacing:1.3px;padding:13px 12px 7px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;color:#aab6cb;text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-weight:600;transition:.15s}.nav button:hover{background:#1d2940;color:white}.nav button.active{background:#293752;color:#fff}.nav .ico{width:21px;text-align:center;font-size:16px}.nav .count{margin-left:auto;background:#e7a63e;color:#202b40;border-radius:20px;padding:1px 7px;font-size:11px;font-weight:800}.sidebar-bottom{margin-top:auto;border-top:1px solid #27344b;padding:14px 7px 3px;color:#9caac2;font-size:12px}.workspace{margin-left:248px;width:calc(100% - 248px);min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4}.crumb{font-size:13px;color:var(--muted)}.crumb strong{color:var(--text);font-size:16px}.top-actions{display:flex;align-items:center;gap:10px}.iconbtn{border:1px solid var(--line);background:white;width:38px;height:38px;border-radius:11px;color:#667187}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e7eaff;color:#5365df;font-weight:800}.main{padding:26px 30px;max-width:1600px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:22px}.pagehead h1{font-size:23px;margin:0 0 5px;letter-spacing:-.5px}.pagehead p{color:var(--muted);margin:0;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:white;color:var(--text);font-weight:650;font-size:12px;display:inline-flex;align-items:center;gap:7px;transition:.15s}.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.success{background:var(--accent2);border-color:var(--accent2);color:white}.btn.danger{color:var(--danger)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:600}.stat-icon{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;font-size:16px;background:#eef0ff;color:#5264df}.stat-value{font-size:23px;font-weight:800;margin:12px 0 3px;letter-spacing:-.5px}.stat-foot{font-size:11px;color:var(--muted)}.positive{color:#16a78b}.negative{color:#e45668}.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}.panel-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-head h2{font-size:14px;margin:0;font-weight:800}.panel-head small{color:var(--muted)}.panel-body{padding:17px 19px}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:17px}.chart-area{height:225px;position:relative}.chart-area canvas{width:100%;height:100%}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#8390a4;font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:800;background:#fafbfe;padding:12px 14px;border-bottom:1px solid var(--line)}td{padding:12px 14px;border-bottom:1px solid #f0f2f6;font-size:12px}tr:last-child td{border-bottom:0}.product-name{font-weight:700}.subtext{font-size:10px;color:var(--muted);margin-top:2px}.badge{padding:4px 8px;border-radius:30px;font-size:10px;font-weight:800;display:inline-block}.badge.ok{background:#e7f8f2;color:#128467}.badge.low{background:#fff5e2;color:#bd8425}.badge.out{background:#ffebee;color:#d3485d}.badge.info{background:#edf0ff;color:#5665dc}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:14px 17px;border-bottom:1px solid var(--line)}.search{position:relative;min-width:190px;flex:1}.search input{width:100%;border:1px solid var(--line);background:#fafbfe;border-radius:10px;padding:9px 12px 9px 33px;outline:none;font-size:12px}.search span{position:absolute;left:11px;top:9px;color:#8d98ab}.toolbar select,.toolbar input[type=date]{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 11px;color:#657188;font-size:12px;outline:none}.empty{text-align:center;padding:36px 18px;color:var(--muted)}.empty .big{font-size:35px;margin-bottom:8px}.row-actions{display:flex;gap:5px}.tiny{border:1px solid var(--line);background:white;border-radius:7px;padding:5px 8px;font-size:11px;color:#69758a}.tiny:hover{background:#f4f6fb}.list-total{padding:13px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fbfcff;cursor:pointer;transition:.15s}.quick:hover{border-color:#bdc6ff;background:#f6f7ff}.quick span{font-size:20px;display:block;margin-bottom:8px}.quick strong{font-size:12px;display:block}.quick small{font-size:10px;color:var(--muted)}.alertline{display:flex;align-items:center;gap:9px;padding:11px 13px;background:#fff8eb;border:1px solid #ffebc7;border-radius:10px;color:#916721;font-size:12px;margin-bottom:9px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.setting{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;align-items:center}.setting:last-child{border:0}.setting strong{display:block;font-size:12px}.setting small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.setting input,.setting select{max-width:180px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px}.modal-back{position:fixed;inset:0;background:#10182888;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal-back.show{display:flex}.modal{background:white;border-radius:18px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 70px #10182835}.modal-head{padding:19px 21px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0;font-size:16px}.modal-content{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:700;color:#657187;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fbfcfe;outline:none;font-size:12px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8592ff;box-shadow:0 0 0 3px #e9ecff}.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;bottom:22px;right:22px;background:#162137;color:white;padding:12px 17px;border-radius:12px;box-shadow:0 10px 35px #0002;z-index:30;display:none;font-size:12px}.toast.show{display:block}.footer-note{color:var(--muted);font-size:10px;text-align:center;padding:16px}.hidden{display:none!important}.mobile-menu{display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}}
@media(max-width:720px){.sidebar{width:74px;padding:14px 9px}.brand{padding:5px 8px 20px}.brandname,.nav-label,.nav button .navtxt,.sidebar-bottom{display:none}.nav button{justify-content:center;padding:12px 6px}.nav .ico{font-size:19px}.workspace{margin-left:74px;width:calc(100% - 74px)}.topbar{padding:0 15px;height:62px}.main{padding:18px 13px}.pagehead{flex-direction:column}.pagehead h1{font-size:20px}.cards{gap:9px}.stat{padding:13px}.stat-value{font-size:19px}.stat-top{font-size:10px}.stat-icon{width:29px;height:29px}.panel-head,.panel-body{padding:14px}.quick-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top-actions .iconbtn:nth-child(2){display:none}}
@media(max-width:420px){.cards{grid-template-columns:1fr 1fr}.actions{width:100%}.actions .btn{flex:1;justify-content:center}.pagehead{margin-bottom:15px}.toolbar{padding:11px}.search{min-width:100%}}
</style>
</head><body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">B</div><div class="brandname">BizFlow<small>GESTION INTELLIGENTE</small></div></div>
<div class="nav-label">MENU PRINCIPAL</div><nav class="nav" id="nav">
<button class="active" data-page="dashboard"><span class="ico">⌂</span><span class="navtxt">Vue d'ensemble</span></button>
<button data-page="products"><span class="ico">▦</span><span class="navtxt">Stock & produits</span><span class="count" id="lowCount">0</span></button>
<button data-page="sales"><span class="ico">🛒</span><span class="navtxt">Ventes</span></button>
<button data-page="journal"><span class="ico">📒</span><span class="navtxt">Journal de caisse</span></button>
<button data-page="purchases"><span class="ico">📦</span><span class="navtxt">Approvisionnements</span></button>
<button data-page="suppliers"><span class="ico">🏭</span><span class="navtxt">Fournisseurs</span></button>
<button data-page="customers"><span class="ico">♙</span><span class="navtxt">Clients & crédits</span></button>
<button data-page="expenses"><span class="ico">↗</span><span class="navtxt">Dépenses</span></button>
<div class="nav-label">ANALYSE & OUTILS</div>
<button data-page="reports"><span class="ico">▤</span><span class="navtxt">Rapports</span></button>
<button data-page="settings"><span class="ico">⚙</span><span class="navtxt">Paramètres</span></button></nav>
<div class="sidebar-bottom">BizFlow Gestion · Version locale<br>Vos données restent sur cet appareil.</div></aside>
<div class="workspace"><header class="topbar"><div class="crumb">BizFlow / <strong id="topTitle">Vue d'ensemble</strong></div><div class="top-actions"><button class="iconbtn" title="Sauvegarder" onclick="backup()">⇩</button><button class="iconbtn" title="Aide" onclick="help()">?</button><div class="avatar">B</div></div></header><main class="main" id="main"></main></div></div>
<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Formulaire</h3><button class="iconbtn" onclick="closeModal()">×</button></div><div class="modal-content" id="modalContent"></div><div class="modal-foot" id="modalFoot"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='bizflow_full_v1';const nowISO=()=>new Date().toISOString().slice(0,10);const uid=()=>Math.random().toString(36).slice(2,9);let db=load();let page='dashboard';let searchText='';let filterValue='';
function blank(){return {settings:{company:'Mon entreprise',currency:'CDF',symbol:'FC',lowLimit:5},products:[],sales:[],purchases:[],suppliers:[],customers:[],expenses:[],movements:[],cashMovements:[]}}
function load(){try{let raw=JSON.parse(localStorage.getItem(KEY)||'{}'),base=blank();return {...base,...raw,settings:{...base.settings,...(raw.settings||{})},products:Array.isArray(raw.products)?raw.products:[],sales:Array.isArray(raw.sales)?raw.sales:[],purchases:Array.isArray(raw.purchases)?raw.purchases:[],suppliers:Array.isArray(raw.suppliers)?raw.suppliers:[],customers:Array.isArray(raw.customers)?raw.customers:[],expenses:Array.isArray(raw.expenses)?raw.expenses:[],movements:Array.isArray(raw.movements)?raw.movements:[],cashMovements:Array.isArray(raw.cashMovements)?raw.cashMovements:[]}}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));render()}catch(e){toast('Erreur de sauvegarde : espace de stockage du navigateur insuffisant. Exportez vos données.')}}
function fmt(n){const cur=db.settings.currency||'CDF';return Number(n||0).toLocaleString('fr-FR',{maximumFractionDigits:2})+' '+cur}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function titleFor(p){return ({dashboard:'Vue d’ensemble',products:'Stock & produits',sales:'Ventes',journal:'Journal de caisse',purchases:'Approvisionnements',suppliers:'Fournisseurs',customers:'Clients & crédits',expenses:'Dépenses',reports:'Rapports',settings:'Paramètres'})[p]||p}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(!b)return;page=b.dataset.page;searchText='';filterValue='';document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
function sum(a,fn){return a.reduce((s,x)=>s+Number(fn(x)||0),0)}
function salesToday(){return db.sales.filter(s=>s.date===nowISO())}
function salePaid(s){let initialPaid=s.paidAmount!==undefined&&s.paidAmount!==null?Number(s.paidAmount):Math.max(0,Number(s.total||0)-Number(s.credit||0));return initialPaid+sum(s.creditPayments||[],p=>p.amount)}
function saleOutstanding(s){return Math.max(0,Number(s.total||0)-salePaid(s))}
function calcSaleProfit(s){return Number(s.total||0)-Number(s.cost||0)}
function stockValue(){return sum(db.products,p=>p.qty*p.cost)}
function lowProducts(){return db.products.filter(p=>p.qty<=Number(p.min??db.settings.lowLimit??5))}
function render(){document.getElementById('topTitle').textContent=titleFor(page);document.getElementById('lowCount').textContent=lowProducts().length;let root=document.getElementById('main');root.innerHTML=({dashboard:dashboardHTML,products:productsHTML,sales:salesHTML,journal:journalHTML,purchases:purchasesHTML,suppliers:suppliersHTML,customers:customersHTML,expenses:expensesHTML,reports:reportsHTML,settings:settingsHTML})[page]();if(page==='dashboard')drawChart();}
function pageHead(title,sub,buttons=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${buttons}</div></div>`}
function dashboardHTML(){let today=salesToday(),rev=sum(today,s=>s.total),profit=sum(today,calcSaleProfit),expenses=sum(db.expenses.filter(e=>e.date===nowISO()),e=>e.amount),credits=sum(db.sales,s=>saleOutstanding(s)),stockTotal=db.products.length,alerts=lowProducts();let last=[...db.sales].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
return pageHead('Bonjour 👋','Voici un aperçu de votre activité commerciale.')+`<div class="cards"><div class="stat"><div class="stat-top">Ventes aujourd'hui <span class="stat-icon">↗</span></div><div class="stat-value">${fmt(rev)}</div><div class="stat-foot">${today.length} transaction(s)</div></div><div class="stat"><div class="stat-top">Profit estimé aujourd'hui <span class="stat-icon">◈</span></div><div class="stat-value">${fmt(profit-expenses)}</div><div class="stat-foot">Après dépenses du jour</div></div><div class="stat"><div class="stat-top">Valeur du stock <span class="stat-icon">▦</span></div><div class="stat-value">${fmt(stockValue())}</div><div class="stat-foot">${stockTotal} article(s) en catalogue</div></div><div class="stat"><div class="stat-top">Crédits clients <span class="stat-icon">♙</span></div><div class="stat-value">${fmt(credits)}</div><div class="stat-foot">Montants restant à encaisser</div></div></div>
<div class="grid2"><section class="panel"><div class="panel-head"><h2>Activité des ventes</h2><small>7 derniers jours</small></div><div class="panel-body"><div class="chart-area"><canvas id="salesChart"></canvas></div></div></section><section class="panel"><div class="panel-head"><h2>Actions rapides</h2></div><div class="panel-body"><div class="quick-grid"><div class="quick" onclick="openProduct()"><span>＋</span><strong>Ajouter un article</strong><small>Créer une fiche stock</small></div><div class="quick" onclick="openSale()"><span>🛒</span><strong>Nouvelle vente</strong><small>Enregistrer une vente</small></div><div class="quick" onclick="openPurchase()"><span>📦</span><strong>Réception</strong><small>Ajouter du stock</small></div><div class="quick" onclick="openExpense()"><span>↗</span><strong>Ajouter dépense</strong><small>Suivre les sorties</small></div></div></div></section></div>
${alerts.length?`<section class="panel"><div class="panel-head"><h2>⚠️ Alertes de stock</h2><small>${alerts.length} article(s) à vérifier</small></div><div class="panel-body">${alerts.slice(0,5).map(p=>`<div class="alertline">⚠️ <strong>${esc(p.name)}</strong> — ${p.qty} restant(s), minimum ${p.min||db.settings.lowLimit}</div>`).join('')}</div></section>`:''}
<section class="panel"><div class="panel-head"><h2>Dernières ventes</h2><button class="btn" onclick="go('sales')">Voir tout →</button></div>${last.length?tableSales(last,false):`<div class="empty"><div class="big">🧾</div>Aucune vente enregistrée.</div>`}</section>`}
function tableSales(list,actions=true){return `<div class="table-wrap"><table><thead><tr><th>Référence</th><th>Date</th><th>Client</th><th>Articles</th><th>Total</th><th>Paiement</th>${actions?'<th></th>':''}</tr></thead><tbody>${list.map(s=>`<tr><td class="product-name">${esc(s.ref||'V-'+s.id)}</td><td>${esc(s.date)}</td><td>${esc(s.customer||'Client comptant')}</td><td>${s.items?.length||1}</td><td><strong>${fmt(s.total)}</strong>${saleOutstanding(s)?`<div class="subtext">Crédit: ${fmt(saleOutstanding(s))}</div>`:''}</td><td><span class="badge ${s.credit?'low':'ok'}">${esc(s.payment||'Cash')}</span></td>${actions?`<td><button class="tiny" onclick="deleteRecord('sales','${s.id}')">Supprimer</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function productsHTML(){let filtered=db.products.filter(p=>(`${p.name} ${p.sku||''} ${p.category||''}`).toLowerCase().includes(searchText.toLowerCase())).filter(p=>!filterValue||(filterValue==='low'?p.qty<=Number(p.min??db.settings.lowLimit):filterValue==='out'?p.qty<=0:true));return pageHead('Stock & produits','Gérez vos articles, les quantités, les prix et les seuils.',`<button class="btn" onclick="exportCSV()">⇩ CSV</button><button class="btn primary" onclick="openProduct()">＋ Ajouter un produit</button>`)+`<section class="panel"><div class="toolbar"><div class="search"><span>⌕</span><input placeholder="Rechercher nom, code, catégorie…" value="${esc(searchText)}" oninput="searchText=this.value;render()"></div><select onchange="filterValue=this.value;render()"><option value="">Tous les stocks</option><option value="low" ${filterValue==='low'?'selected':''}>Stock faible</option><option value="out" ${filterValue==='out'?'selected':''}>Épuisés</option></select></div>${filtered.length?`<div class="table-wrap"><table><thead><tr><th>Produit</th><th>Code</th><th>Catégorie</th><th>Qté</th><th>Coût unitaire</th><th>Prix vente</th><th>Valeur stock</th><th>Statut</th><th></th></tr></thead><tbody>${filtered.map(p=>`<tr><td class="product-name">${esc(p.name)}</td><td>${esc(p.sku||'—')}</td><td>${esc(p.category||'—')}</td><td><strong>${p.qty}</strong> ${esc(p.unit||'pcs')}</td><td>${fmt(p.cost)}</td><td>${fmt(p.price)}</td><td>${fmt(p.qty*p.cost)}</td><td>${stockBadge(p)}</td><td><div class="row-actions"><button class="tiny" onclick="openProduct('${p.id}')">Modifier</button><button class="tiny" onclick="adjustStock('${p.id}')">± Stock</button></div></td></tr>`).join('')}</tbody></table></div><div class="list-total">${filtered.length} produit(s) · Valeur inventaire: <strong>${fmt(sum(filtered,p=>p.qty*p.cost))}</strong></div>`:`<div class="empty"><div class="big">📦</div>Aucun produit trouvé.<br>Ajoutez vos articles pour commencer.</div>`}</section>`}
function stockBadge(p){let n=Number(p.min||db.settings.lowLimit||5);return p.qty<=0?'<span class="badge out">Épuisé</span>':p.qty<=n?'<span class="badge low">Stock faible</span>':'<span class="badge ok">Disponible</span>'}
function salesHTML(){let list=[...db.sales].sort((a,b)=>b.date.localeCompare(a.date));return pageHead('Ventes','Historique des transactions, encaissements et crédits.',`<button class="btn" onclick="exportSalesCSV()">⇩ Journal ventes CSV</button><button class="btn primary" onclick="openSale()">＋ Nouvelle vente</button>`)+`<div class="cards"><div class="stat"><div class="stat-top">Ventes cumulées</div><div class="stat-value">${fmt(sum(db.sales,s=>s.total))}</div></div><div class="stat"><div class="stat-top">Transactions</div><div class="stat-value">${db.sales.length}</div></div><div class="stat"><div class="stat-top">Crédits en cours</div><div class="stat-value">${fmt(sum(db.sales,s=>saleOutstanding(s)))}</div></div><div class="stat"><div class="stat-top">Profit estimé</div><div class="stat-value">${fmt(sum(db.sales,calcSaleProfit))}</div></div></div><section class="panel"><div class="toolbar"><div class="search"><span>⌕</span><input placeholder="Rechercher une vente ou un client…" value="${esc(searchText)}" oninput="searchText=this.value;render()"></div></div>${list.filter(s=>(s.ref+' '+s.customer).toLowerCase().includes(searchText.toLowerCase())).length?tableSales(list.filter(s=>(s.ref+' '+s.customer).toLowerCase().includes(searchText.toLowerCase()))):`<div class="empty">Aucune transaction enregistrée.</div>`}</section>`}
function journalHTML(){let monthFilter=window.journalMonth||nowISO().slice(0,7);let entries=[...db.cashMovements].filter(m=>!monthFilter||String(m.date||'').startsWith(monthFilter)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));let inflow=sum(entries.filter(m=>m.direction==='in'),m=>m.amount),outflow=sum(entries.filter(m=>m.direction==='out'),m=>m.amount);return pageHead('Journal de caisse','Historique unique des entrées et sorties d’argent.',`<button class="btn" onclick="exportJournalCSV()">⇩ Export CSV</button><button class="btn primary" onclick="openCashEntry()">＋ Mouvement manuel</button>`)+`<div class="cards"><div class="stat"><div class="stat-top">Entrées période</div><div class="stat-value positive">${fmt(inflow)}</div></div><div class="stat"><div class="stat-top">Sorties période</div><div class="stat-value negative">${fmt(outflow)}</div></div><div class="stat"><div class="stat-top">Net période</div><div class="stat-value ${inflow-outflow>=0?'positive':'negative'}">${fmt(inflow-outflow)}</div></div><div class="stat"><div class="stat-top">Opérations</div><div class="stat-value">${entries.length}</div></div></div><section class="panel"><div class="toolbar"><label>Mois : <input type="month" value="${esc(monthFilter)}" onchange="window.journalMonth=this.value;render()"></label><button class="btn" onclick="window.journalMonth='';render()">Tout afficher</button></div>${entries.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Entrée</th><th>Sortie</th></tr></thead><tbody>${entries.map(m=>`<tr><td>${esc(m.date)}</td><td><span class="badge info">${esc(m.kind||'manuel')}</span></td><td>${esc(m.note||'—')}</td><td class="positive">${m.direction==='in'?fmt(m.amount):'—'}</td><td class="negative">${m.direction==='out'?fmt(m.amount):'—'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Aucun mouvement de caisse sur cette période.</div>`}</section>`}
function openCashEntry(){openModal('Mouvement manuel de caisse',`<div class="form-grid"><div class="field"><label>Type *</label><select id="cashDir"><option value="in">Entrée d'argent</option><option value="out">Sortie d'argent</option></select></div><div class="field"><label>Date</label><input type="date" id="cashDate" value="${nowISO()}"></div><div class="field"><label>Montant *</label><input type="number" id="cashAmount" min="0.01" step="0.01"></div><div class="field full"><label>Description *</label><input id="cashNote" placeholder="Ex. apport, retrait, correction…"></div></div>`,`<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveCashEntry()">Enregistrer</button>`)}
function saveCashEntry(){let amount=Number(document.getElementById('cashAmount').value),note=document.getElementById('cashNote').value.trim();if(amount<=0||!note){toast('Saisissez un montant et une description.');return}db.cashMovements.push({id:uid(),date:document.getElementById('cashDate').value||nowISO(),kind:'manual',direction:document.getElementById('cashDir').value,amount,note});closeModal();save();toast('Mouvement de caisse enregistré.')}
function openCreditPayment(id){let s=db.sales.find(x=>x.id===id);if(!s)return;openModal('Encaisser un crédit',`<p>Vente <strong>${esc(s.ref)}</strong> · Solde restant : <strong>${fmt(saleOutstanding(s))}</strong></p><div class="form-grid"><div class="field"><label>Montant reçu *</label><input id="creditAmount" type="number" min="0.01" step="0.01" max="${saleOutstanding(s)}"></div><div class="field"><label>Date</label><input id="creditDate" type="date" value="${nowISO()}"></div><div class="field full"><label>Mode de paiement</label><select id="creditMethod"><option>Cash</option><option>Mobile Money</option><option>Carte</option><option>Autre</option></select></div></div>`,`<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveCreditPayment('${id}')">Confirmer paiement</button>`)}
function saveCreditPayment(id){let s=db.sales.find(x=>x.id===id),amount=Number(document.getElementById('creditAmount').value);if(!s||amount<=0||amount>saleOutstanding(s)){toast('Montant invalide ou supérieur au solde.');return}let date=document.getElementById('creditDate').value||nowISO();s.creditPayments=s.creditPayments||[];s.creditPayments.push({id:uid(),date,amount,method:document.getElementById('creditMethod').value});s.credit=Math.max(0,saleOutstanding(s));db.cashMovements.push({id:uid(),sourceId:s.id,date,kind:'credit-payment',direction:'in',amount,note:s.ref+' · '+(s.customer||'Client')+' · règlement crédit'});closeModal();save();toast('Règlement de crédit enregistré.')}
function exportJournalCSV(){let entries=[...db.cashMovements].sort((a,b)=>String(a.date).localeCompare(String(b.date)));let rows=[['Date','Type','Sens','Montant','Description'],...entries.map(m=>[m.date,m.kind,m.direction==='in'?'Entrée':'Sortie',m.amount,m.note])];downloadCSV(rows,'bizflow-journal-caisse-'+nowISO()+'.csv')}
function exportSalesCSV(){let rows=[['Date','Référence','Client','Total','Payé','Solde','Mode paiement'],...db.sales.map(s=>[s.date,s.ref,s.customer,s.total,salePaid(s),saleOutstanding(s),s.payment])];downloadCSV(rows,'bizflow-journal-ventes-'+nowISO()+'.csv')}
function exportExpensesCSV(){let rows=[['Date','Motif','Catégorie','Montant','Note'],...db.expenses.map(e=>[e.date,e.reason,e.category,e.amount,e.note])];downloadCSV(rows,'bizflow-depenses-'+nowISO()+'.csv')}
function downloadCSV(rows,name){let csv=rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function purchasesHTML(){let list=[...db.purchases].sort((a,b)=>b.date.localeCompare(a.date));return pageHead('Approvisionnements','Enregistrez les entrées de marchandises et les achats.',`<button class="btn primary" onclick="openPurchase()">＋ Nouvel achat</button>`)+`<div class="cards"><div class="stat"><div class="stat-top">Achats cumulés</div><div class="stat-value">${fmt(sum(db.purchases,p=>p.total))}</div></div><div class="stat"><div class="stat-top">Réceptions</div><div class="stat-value">${db.purchases.length}</div></div><div class="stat"><div class="stat-top">Articles en stock</div><div class="stat-value">${sum(db.products,p=>p.qty)}</div></div><div class="stat"><div class="stat-top">Produits</div><div class="stat-value">${db.products.length}</div></div></div><section class="panel">${list.length?`<div class="table-wrap"><table><thead><tr><th>Référence</th><th>Date</th><th>Fournisseur</th><th>Produit</th><th>Quantité</th><th>Total</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td>ACH-${p.id}</td><td>${p.date}</td><td>${esc(p.supplier||'—')}</td><td>${esc(p.productName)}</td><td>${p.qty}</td><td><strong>${fmt(p.total)}</strong></td><td><button class="tiny" onclick="deleteRecord('purchases','${p.id}')">Supprimer</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">📦</div>Aucun approvisionnement enregistré.</div>`}</section>`}
function suppliersHTML(){let list=[...db.suppliers].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));let filtered=list.filter(x=>(`${x.name||''} ${x.phone||''} ${x.address||''}`).toLowerCase().includes(searchText.toLowerCase()));return pageHead('Fournisseurs','Répertoire de contacts réutilisable pour les achats.',`<button class="btn primary" onclick="openSupplier()">＋ Ajouter un fournisseur</button>`)+`<section class="panel"><div class="toolbar"><div class="search"><span>⌕</span><input placeholder="Rechercher fournisseur ou contact…" value="${esc(searchText)}" oninput="searchText=this.value;render()"></div></div>${filtered.length?`<div class="table-wrap"><table><thead><tr><th>Fournisseur</th><th>Téléphone</th><th>Adresse</th><th>Achats</th><th></th></tr></thead><tbody>${filtered.map(x=>`<tr><td class="product-name">${esc(x.name)}</td><td>${esc(x.phone||'—')}</td><td>${esc(x.address||'—')}</td><td>${db.purchases.filter(p=>p.supplier===x.name).length}</td><td><button class="tiny" onclick="openSupplier('${x.id}')">Modifier</button><button class="tiny" onclick="deleteRecord('suppliers','${x.id}')">Supprimer</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">🏭</div>Aucun fournisseur enregistré. Les fournisseurs saisis lors des achats peuvent être ajoutés à ce répertoire.</div>`}</section>`}
function customersHTML(){return pageHead('Clients & crédits','Suivez vos clients et les soldes à recouvrer.',`<button class="btn primary" onclick="openCustomer()">＋ Nouveau client</button>`)+`<div class="cards"><div class="stat"><div class="stat-top">Clients</div><div class="stat-value">${db.customers.length}</div></div><div class="stat"><div class="stat-top">Crédits non réglés</div><div class="stat-value">${fmt(sum(db.sales,s=>saleOutstanding(s)))}</div></div><div class="stat"><div class="stat-top">Ventes client</div><div class="stat-value">${fmt(sum(db.sales,s=>s.total))}</div></div><div class="stat"><div class="stat-top">Paiements reçus</div><div class="stat-value">${fmt(sum(db.sales,s=>s.total-s.credit))}</div></div></div><section class="panel"><div class="toolbar"><div class="search"><span>⌕</span><input placeholder="Rechercher un client…" value="${esc(searchText)}" oninput="searchText=this.value;render()"></div></div>${db.customers.length?`<div class="table-wrap"><table><thead><tr><th>Client</th><th>Contact</th><th>Adresse</th><th>Achats</th><th>Crédit restant</th><th></th></tr></thead><tbody>${db.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(searchText.toLowerCase())).map(c=>{let purchases=db.sales.filter(s=>s.customer===c.name);let credit=sum(purchases,s=>s.credit);return `<tr><td class="product-name">${esc(c.name)}</td><td>${esc(c.phone||'—')}</td><td>${esc(c.address||'—')}</td><td>${fmt(sum(purchases,s=>s.total))}</td><td><strong>${fmt(credit)}</strong></td><td><button class="tiny" onclick="openCustomer('${c.id}')">Modifier</button><button class="tiny" onclick="deleteRecord('customers','${c.id}')">Supprimer</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">♙</div>Votre liste de clients est vide.</div>`}</section>`}
function expensesHTML(){let list=[...db.expenses].sort((a,b)=>b.date.localeCompare(a.date));return pageHead('Dépenses','Suivez les frais et autres sorties de votre entreprise.',`<button class="btn" onclick="exportExpensesCSV()">⇩ CSV dépenses</button><button class="btn primary" onclick="openExpense()">＋ Ajouter une dépense</button>`)+`<div class="cards"><div class="stat"><div class="stat-top">Dépenses cumulées</div><div class="stat-value">${fmt(sum(db.expenses,e=>e.amount))}</div></div><div class="stat"><div class="stat-top">Dépenses aujourd'hui</div><div class="stat-value">${fmt(sum(db.expenses.filter(e=>e.date===nowISO()),e=>e.amount))}</div></div><div class="stat"><div class="stat-top">Nombre d'enregistrements</div><div class="stat-value">${db.expenses.length}</div></div><div class="stat"><div class="stat-top">Catégories</div><div class="stat-value">${new Set(db.expenses.map(e=>e.category)).size}</div></div></div><section class="panel">${list.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Motif</th><th>Catégorie</th><th>Montant</th><th></th></tr></thead><tbody>${list.map(e=>`<tr><td>${e.date}</td><td class="product-name">${esc(e.reason)}</td><td>${esc(e.category)}</td><td><strong>${fmt(e.amount)}</strong></td><td><button class="tiny" onclick="deleteRecord('expenses','${e.id}')">Supprimer</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">↗</div>Aucune dépense enregistrée.</div>`}</section>`}
function reportsHTML(){let month=nowISO().slice(0,7),ms=db.sales.filter(s=>s.date.startsWith(month)),me=db.expenses.filter(e=>e.date.startsWith(month)),mp=db.purchases.filter(p=>p.date.startsWith(month));let total=sum(ms,s=>s.total),cost=sum(ms,s=>s.cost),ex=sum(me,e=>e.amount),profit=total-cost-ex;return pageHead('Rapports','Résumé financier de la période en cours.',`<button class="btn" onclick="backup()">⇩ Export données</button><button class="btn primary" onclick="exportCSV()">⇩ Export stock CSV</button>`)+`<div class="cards"><div class="stat"><div class="stat-top">Chiffre d'affaires (mois)</div><div class="stat-value">${fmt(total)}</div></div><div class="stat"><div class="stat-top">Coût marchandises vendues</div><div class="stat-value">${fmt(cost)}</div></div><div class="stat"><div class="stat-top">Dépenses (mois)</div><div class="stat-value">${fmt(ex)}</div></div><div class="stat"><div class="stat-top">Résultat estimé</div><div class="stat-value ${profit>=0?'positive':'negative'}">${fmt(profit)}</div></div></div><div class="grid2"><section class="panel"><div class="panel-head"><h2>Résumé du mois</h2></div><div class="panel-body"><div class="setting"><div><strong>Ventes enregistrées</strong><small>Nombre de transactions</small></div><strong>${ms.length}</strong></div><div class="setting"><div><strong>Achats / réceptions</strong><small>Nombre d'approvisionnements</small></div><strong>${mp.length}</strong></div><div class="setting"><div><strong>Total achats</strong></div><strong>${fmt(sum(mp,p=>p.total))}</strong></div><div class="setting"><div><strong>Clients actifs</strong></div><strong>${new Set(ms.map(s=>s.customer).filter(Boolean)).size}</strong></div></div></section><section class="panel"><div class="panel-head"><h2>Inventaire actuel</h2></div><div class="panel-body"><div class="setting"><div><strong>Produits référencés</strong></div><strong>${db.products.length}</strong></div><div class="setting"><div><strong>Quantité totale en stock</strong></div><strong>${sum(db.products,p=>p.qty)}</strong></div><div class="setting"><div><strong>Valeur au coût</strong></div><strong>${fmt(stockValue())}</strong></div><div class="setting"><div><strong>Articles à réapprovisionner</strong></div><strong>${lowProducts().length}</strong></div></div></section></div><div class="footer-note">Le résultat est estimatif : les ventes à crédit sont comptées comme chiffre d'affaires à la date de vente.</div>`}
function settingsHTML(){return pageHead('Paramètres','Personnalisez BizFlow et gérez vos données.',`<button class="btn primary" onclick="saveSettings()">Enregistrer les paramètres</button>`)+`<div class="settings-grid"><section class="panel"><div class="panel-head"><h2>Profil entreprise</h2></div><div class="panel-body"><div class="field"><label>Nom de l'entreprise</label><input id="company" value="${esc(db.settings.company)}"></div><div class="field" style="margin-top:12px"><label>Devise (code)</label><input id="currency" value="${esc(db.settings.currency)}" placeholder="CDF, USD, EUR…"></div><div class="field" style="margin-top:12px"><label>Symbole de devise</label><input id="symbol" value="${esc(db.settings.symbol||'FC')}" placeholder="FC, $, €"></div><div class="field" style="margin-top:12px"><label>Seuil de stock faible par défaut</label><input id="lowLimit" type="number" min="0" value="${db.settings.lowLimit}"></div></div></section><section class="panel"><div class="panel-head"><h2>Sauvegarde & restauration</h2></div><div class="panel-body"><p style="font-size:12px;color:var(--muted)">Exportez vos données pour garder une copie de sécurité. Le JSON inclut vos produits, ventes, achats, clients, dépenses et journal de caisse.</p><button class="btn success" onclick="backup()">⇩ Télécharger sauvegarde JSON</button><div style="height:12px"></div><label class="btn" for="restoreFile">⇧ Restaurer depuis JSON</label><input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restore(this)"><div style="height:18px"></div><button class="btn danger" onclick="resetData()">Réinitialiser toutes les données</button></div></section><section class="panel"><div class="panel-head"><h2>À propos</h2></div><div class="panel-body"><strong>BizFlow Gestion</strong><p style="color:var(--muted);font-size:12px">Application de gestion de stock, ventes, achats et suivi financier. Version locale autonome. Vos données sont conservées dans le stockage du navigateur de cet appareil.</p><span class="badge info">Version 1.2 · Hors ligne</span></div></section><section class="panel"><div class="panel-head"><h2>Conseils d'utilisation</h2></div><div class="panel-body" style="font-size:12px;color:var(--muted)"><p>1. Créez d'abord vos produits avec leur coût et prix de vente.</p><p>2. Enregistrez les achats pour augmenter le stock.</p><p>3. Enregistrez les ventes : le stock est réduit automatiquement.</p><p>4. Consultez Journal de caisse pour suivre les entrées et sorties.
<p>5. Exportez régulièrement votre fichier de sauvegarde JSON et le CSV du journal.</p></div></section></div>`}
function go(p){page=p;searchText='';filterValue='';document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}
function openModal(title,content,foot){document.getElementById('modalTitle').textContent=title;document.getElementById('modalContent').innerHTML=content;document.getElementById('modalFoot').innerHTML=foot;document.getElementById('modalBack').classList.add('show')}
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function openProduct(id){let p=db.products.find(x=>x.id===id)||{};openModal(id?'Modifier le produit':'Ajouter un produit',`<div class="form-grid"><div class="field full"><label>Nom du produit *</label><input id="pname" value="${esc(p.name||'')}" placeholder="Ex. Riz 25 kg"></div><div class="field"><label>Code / SKU</label><input id="psku" value="${esc(p.sku||'')}" placeholder="Code produit"></div><div class="field"><label>Catégorie</label><input id="pcat" value="${esc(p.category||'')}" placeholder="Ex. Alimentaire"></div><div class="field"><label>Quantité en stock</label><input id="pqty" type="number" min="0" value="${p.qty??0}"></div><div class="field"><label>Unité</label><input id="punit" value="${esc(p.unit||'pcs')}" placeholder="pcs, kg, L…"></div><div class="field"><label>Prix d'achat unitaire</label><input id="pcost" type="number" min="0" value="${p.cost??0}"></div><div class="field"><label>Prix de vente unitaire</label><input id="pprice" type="number" min="0" value="${p.price??0}"></div><div class="field"><label>Seuil stock minimum</label><input id="pmin" type="number" min="0" value="${p.min??db.settings.lowLimit}"></div><div class="field"><label>Notes</label><input id="pnotes" value="${esc(p.notes||'')}" placeholder="Optionnel"></div></div>`,`<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveProduct('${id||''}')">Enregistrer</button>`)}
function saveProduct(id){let name=document.getElementById('pname').value.trim();if(!name){toast('Veuillez saisir le nom du produit.');return}let old=db.products.find(p=>p.id===id);let obj={id:id||uid(),name,sku:document.getElementById('psku').value.trim(),category:document.getElementById('pcat').value.trim(),qty:Math.max(0,Number(document.getElementById('pqty').value)),unit:document.getElementById('punit').value.trim()||'pcs',cost:Math.max(0,Number(document.getElementById('pcost').value)),price:Math.max(0,Number(document.getElementById('pprice').value)),min:Math.max(0,Number(document.getElementById('pmin').value)),notes:document.getElementById('pnotes').value.trim()};if(old){Object.assign(old,obj)}else db.products.push(obj);db.movements.push({id:uid(),productId:obj.id,kind:'initial/update',qty:obj.qty,date:nowISO(),note:'Fiche produit'});closeModal();save();toast('Produit enregistré.')}
function adjustStock(id){let p=db.products.find(x=>x.id===id);if(!p)return;openModal('Ajuster le stock',`<p><strong>${esc(p.name)}</strong> · Stock actuel: ${p.qty} ${esc(p.unit)}</p><div class="form-grid"><div class="field"><label>Type d'opération</label><select id="adjType"><option value="add">Entrée (+)</option><option value="remove">Sortie (−)</option><option value="set">Fixer quantité</option></select></div><div class="field"><label>Quantité</label><input id="adjQty" type="number" min="0" value="1"></div><div class="field full"><label>Motif</label><input id="adjNote" placeholder="Inventaire, casse, correction…"></div></div>`,`<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="applyAdjust('${id}')">Confirmer</button>`)}
function applyAdjust(id){let p=db.products.find(x=>x.id===id),n=Number(document.getElementById('adjQty').value),type=document.getElementById('adjType').value;if(!p||n<0)return;let before=p.qty;if(type==='add')p.qty+=n;else if(type==='remove')p.qty=Math.max(0,p.qty-n);else p.qty=n;db.movements.push({id:uid(),productId:id,kind:type,qty:p.qty-before,date:nowISO(),note:document.getElementById('adjNote').value});closeModal();save();toast('Stock ajusté.');}
function openSale(){let options=db.products.map(p=>`<option value="${p.id}">${esc(p.name)} · Stock ${p.qty} · ${fmt(p.price)}</option>`).join('');openModal('Nouvelle vente',`<div class="form-grid"><div class="field"><label>Client</label><select id="saleCustomer"><option value="">Client comptant</option>${db.customers.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="saleDate" type="date" value="${nowISO()}"></div><div class="field full"><label>Produit</label><select id="saleProduct">${options||'<option>Créez un produit d’abord</option>'}</select></div><div class="field"><label>Quantité</label><input id="saleQty" type="number" min="1" value="1"></div><div class="field"><label>Prix unitaire (modifiable)</label><input id="salePrice" type="number" min="0" value="${db.products[0]?.price||0}"></div><div class="field"><label>Type de paiement</label><select id="salePayment"><option>Cash</option><option>Mobile Money</option><option>Carte</option><option>Crédit</option><option>Mixte</option></select></div><div class="field"><label>Montant payé</label><input id="salePaid" type="number" min="0" placeholder="Vide = montant total"></div><div class="field full"><label>Note</label><input id="saleNote" placeholder="Optionnel"></div></div><p style="font-size:11px;color:#7c879a">La vente est enregistrée en une ligne de produit. Le stock sera déduit automatiquement.</p>`,`<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveSale()">Enregistrer la vente</button>`);document.getElementById('saleProduct').addEventListener('change',()=>{let p=db.products.find(x=>x.id===document.getElementById('saleProduct').value);if(p)document.getElementById('salePrice').value=p.price});document.getElementById('salePayment').addEventListener('change',()=>{let field=document.getElementById('salePaid');field.value=document.getElementById('salePayment').value==='Crédit'?'0':''});}
function saveSale(){let p=db.products.find(x=>x.id===document.getElementById('saleProduct').value);if(!p){toast('Ajoutez un produit avant de vendre.');return}let qty=Number(document.getElementById('saleQty').value),price=Number(document.getElementById('salePrice').value);if(qty<=0||price<0){toast('Quantité ou prix invalide.');return}if(p.qty<qty){toast('Stock insuffisant.');return}let total=qty*price,paid=document.getElementById('salePaid').value===''?total:Math.max(0,Number(document.getElementById('salePaid').value)),credit=Math.max(0,total-paid);if(paid>total){toast('Le montant payé ne peut pas dépasser le total.');return}let customer=document.getElementById('saleCustomer').value;let sale={id:uid(),ref:'V-'+Date.now().toString().slice(-6),date:document.getElementById('saleDate').value||nowISO(),customer,items:[{productId:p.id,name:p.name,qty,price}],total,cost:qty*p.cost,paidAmount:paid,credit,payment:document.getElementById('salePayment').value,note:document.getElementById('saleNote').value};p.qty-=qty;db.sales.push(sale);if(paid>0)db.cashMovements.push({id:uid(),sourceId:sale.id,date:sale.date,kind:'sale',direction:'in',amount:paid,note:sale.ref+' · '+(customer||'Client comptant')});db.movements.push({id:uid(),productId:p.id,kind:'sale',qty:-qty,date:sale.date,note:sale.ref});closeModal();save();toast('Vente enregistrée.');}
function openPurchase(){let opts=db.products.map(p=>`<option value="${p.id}">${esc(p.name)} · coût ${fmt(p.cost)}</option>`).join('');openModal('Nouvel approvisionnement',`<div class="form-grid"><div class="field"><label>Produit *</label><select id="buyProduct">${opts||'<option>Aucun produit</option>'}</select></div><div class="field"><label>Date</label><input id="buyDate" type="date" value="${nowISO()}"></div><div class="field"><label>Quantité reçue</label><input id="buyQty" type="number" min="1" value="1"></div><div class="field"><label>Coût unitaire</label><input id="buyCost" type="number" min="0" value="${db.products[0]?.cost||0}"></div><div class="field"><label>Fournisseur</label><input id="buySupplier" placeholder="Nom fournisseur"></div><div class="field"><label>Note</label><input id="buyNote" placeholder="Optionnel"></div></div>`,`<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="savePurchase()">Enregistrer l'achat</button>`);document.getElementById('buyProduct').addEventListener('change',()=>{let p=db.products.find(x=>x.id===document.getElementById('buyProduct').value);if(p)document.getElementById('buyCost').value=p.cost})}
function savePurchase(){let p=db.products.find(x=>x.id===document.getElementById('buyProduct').value),qty=Number(document.getElementById('buyQty').value),cost=Number(document.getElementById('buyCost').value);if(!p||qty<=0||cost<0){toast('Vérifiez le produit, la quantité et le coût.');return}p.qty+=qty;p.cost=cost;let obj={id:uid(),date:document.getElementById('buyDate').value||nowISO(),productId:p.id,productName:p.name,qty,cost,total:qty*cost,supplier:document.getElementById('buySupplier').value,note:document.getElementById('buyNote').value};db.purchases.push(obj);if(obj.supplier.trim()&&!db.suppliers.some(x=>String(x.name||'').toLowerCase()===obj.supplier.trim().toLowerCase()))db.suppliers.push({id:uid(),name:obj.supplier.trim(),phone:'',address:'',note:''});db.cashMovements.push({id:uid(),sourceId:obj.id,date:obj.date,kind:'purchase',direction:'out',amount:obj.total,note:obj.productName+' · '+(obj.supplier||'Fournisseur')});db.movements.push({id:uid(),productId:p.id,kind:'purchase',qty,date:obj.date,note:obj.supplier});closeModal();save();toast('Approvisionnement enregistré, stock augmenté.')}
function openSupplier(id){let x=db.suppliers.find(v=>v.id===id)||{};openModal(id?'Modifier fournisseur':'Nouveau fournisseur',`<div class="form-grid"><div class="field full"><label>Nom *</label><input id="supName" value="${esc(x.name||'')}" placeholder="Nom du fournisseur"></div><div class="field"><label>Téléphone</label><input id="supPhone" value="${esc(x.phone||'')}" placeholder="Contact"></div><div class="field"><label>Adresse</label><input id="supAddress" value="${esc(x.address||'')}" placeholder="Adresse"></div><div class="field full"><label>Notes</label><input id="supNote" value="${esc(x.note||'')}" placeholder="Notes utiles"></div></div>`,`<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveSupplier('${id||''}')">Enregistrer</button>`)}
function saveSupplier(id){let name=document.getElementById('supName').value.trim();if(!name){toast('Le nom du fournisseur est requis.');return}if(db.suppliers.some(x=>x.id!==id&&String(x.name||'').trim().toLowerCase()===name.toLowerCase())){toast('Ce fournisseur existe déjà.');return}let obj={id:id||uid(),name,phone:document.getElementById('supPhone').value.trim(),address:document.getElementById('supAddress').value.trim(),note:document.getElementById('supNote').value.trim()};let old=db.suppliers.find(x=>x.id===id);if(old){let prior=old.name;Object.assign(old,obj);if(prior!==name)db.purchases.forEach(p=>{if(p.supplier===prior)p.supplier=name})}else db.suppliers.push(obj);closeModal();save();toast('Fournisseur enregistré.')}
function openExpense(){openModal('Ajouter une dépense',`<div class="form-grid"><div class="field full"><label>Motif *</label><input id="expReason" placeholder="Ex. transport, loyer, électricité"></div><div class="field"><label>Catégorie</label><select id="expCategory"><option>Transport</option><option>Loyer</option><option>Électricité</option><option>Salaires</option><option>Communication</option><option>Fournitures</option><option>Autre</option></select></div><div class="field"><label>Montant *</label><input id="expAmount" type="number" min="0"></div><div class="field"><label>Date</label><input id="expDate" type="date" value="${nowISO()}"></div><div class="field"><label>Note</label><input id="expNote" placeholder="Optionnel"></div></div>`,`<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveExpense()">Enregistrer</button>`)}
function saveExpense(){let reason=document.getElementById('expReason').value.trim(),amount=Number(document.getElementById('expAmount').value);if(!reason||amount<=0){toast('Motif et montant requis.');return}let expense={id:uid(),reason,category:document.getElementById('expCategory').value,amount,date:document.getElementById('expDate').value||nowISO(),note:document.getElementById('expNote').value};db.expenses.push(expense);db.cashMovements.push({id:uid(),sourceId:expense.id,date:expense.date,kind:'expense',direction:'out',amount,note:expense.reason+' · '+expense.category});closeModal();save();toast('Dépense ajoutée.')}
function openCustomer(id){let c=db.customers.find(x=>x.id===id)||{};openModal(id?'Modifier client':'Nouveau client',`<div class="form-grid"><div class="field full"><label>Nom *</label><input id="cname" value="${esc(c.name||'')}" placeholder="Nom du client"></div><div class="field"><label>Téléphone</label><input id="cphone" value="${esc(c.phone||'')}" placeholder="Contact"></div><div class="field"><label>Adresse</label><input id="caddress" value="${esc(c.address||'')}" placeholder="Adresse"></div><div class="field full"><label>Note</label><input id="cnote" value="${esc(c.note||'')}" placeholder="Informations complémentaires"></div></div>`,`<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveCustomer('${id||''}')">Enregistrer</button>`)}
function saveCustomer(id){let name=document.getElementById('cname').value.trim();if(!name){toast('Nom du client requis.');return}let c={id:id||uid(),name,phone:document.getElementById('cphone').value,address:document.getElementById('caddress').value,note:document.getElementById('cnote').value};let old=db.customers.find(x=>x.id===id);if(old)Object.assign(old,c);else db.customers.push(c);closeModal();save();toast('Client enregistré.')}
function deleteRecord(collection,id){let item=db[collection]?.find(x=>x.id===id);if(!item)return;if(collection==='purchases'){let p=db.products.find(x=>x.id===item.productId);if(p&&p.qty<Number(item.qty||0)){toast('Suppression bloquée : une partie du stock de cet achat a déjà été vendue. Corrigez le stock avant.');return}}if(!confirm('Supprimer cet enregistrement ? Le stock et les mouvements associés seront corrigés.'))return;if(collection==='sales')(item.items||[]).forEach(it=>{let p=db.products.find(x=>x.id===it.productId);if(p)p.qty+=Number(it.qty||0)});if(collection==='purchases'){let p=db.products.find(x=>x.id===item.productId);if(p)p.qty-=Number(item.qty||0)}db[collection]=db[collection].filter(x=>x.id!==id);if(['sales','purchases','expenses'].includes(collection))db.cashMovements=db.cashMovements.filter(m=>m.sourceId!==id);if(collection==='suppliers')db.purchases.forEach(p=>{if(p.supplier===item.name)p.supplier=''});save();toast('Enregistrement supprimé.')}
function saveSettings(){db.settings.company=document.getElementById('company').value.trim()||'Mon entreprise';db.settings.currency=document.getElementById('currency').value.trim()||'CDF';db.settings.symbol=document.getElementById('symbol').value.trim()||'FC';db.settings.lowLimit=Math.max(0,Number(document.getElementById('lowLimit').value));save();toast('Paramètres sauvegardés.')}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bizflow-sauvegarde-'+nowISO()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Sauvegarde téléchargée.')}
function restore(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!data.products||!data.sales)throw 0;if(!confirm('Restaurer cette sauvegarde ? Les données actuelles seront remplacées.'))return;let base=blank();db={...base,...data,settings:{...base.settings,...(data.settings||{})},products:Array.isArray(data.products)?data.products:[],sales:Array.isArray(data.sales)?data.sales:[],purchases:Array.isArray(data.purchases)?data.purchases:[],suppliers:Array.isArray(data.suppliers)?data.suppliers:[],customers:Array.isArray(data.customers)?data.customers:[],expenses:Array.isArray(data.expenses)?data.expenses:[],movements:Array.isArray(data.movements)?data.movements:[],cashMovements:Array.isArray(data.cashMovements)?data.cashMovements:[]};save();toast('Sauvegarde restaurée.')}catch(e){alert('Fichier invalide ou incompatible.')}input.value=''};r.readAsText(f)}
function exportCSV(){let headers=['Nom','SKU','Categorie','Quantite','Unite','Prix achat','Prix vente','Stock minimum','Valeur stock'];let rows=db.products.map(p=>[p.name,p.sku,p.category,p.qty,p.unit,p.cost,p.price,p.min,p.qty*p.cost]);let csv=[headers,...rows].map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bizflow-stock-'+nowISO()+'.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV exporté.')}
function resetData(){if(!confirm('ATTENTION : effacer tous les produits, ventes, achats, clients et dépenses ?'))return;if(!confirm('Confirmez une deuxième fois la suppression totale.'))return;db=blank();save();toast('Données réinitialisées.')}
function help(){alert('BizFlow\n\nCommencez par créer vos produits dans Stock & produits. Les ventes réduisent automatiquement le stock. Les achats augmentent les quantités. Utilisez Journal de caisse pour suivre les entrées, sorties et encaissements de crédit. Utilisez Paramètres pour sauvegarder ou restaurer vos données.\n\nImportant : données stockées uniquement dans ce navigateur/appareil. Exportez régulièrement une sauvegarde JSON.')}
function drawChart(){let canvas=document.getElementById('salesChart');if(!canvas)return;let ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);let dates=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);dates.push(d.toISOString().slice(0,10))}let vals=dates.map(d=>sum(db.sales.filter(s=>s.date===d),s=>s.total));let max=Math.max(1,...vals),pad={l:36,r:12,t:12,b:30},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;ctx.font='10px system-ui';ctx.fillStyle='#8b96a8';ctx.strokeStyle='#edf0f5';ctx.lineWidth=1;for(let i=0;i<4;i++){let y=pad.t+ch*i/3;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText(Math.round(max*(1-i/3)).toLocaleString('fr-FR'),2,y+3)}let pts=vals.map((v,i)=>({x:pad.l+(cw/(6||1))*i,y:pad.t+ch-(v/max)*ch}));ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='#6374ef';ctx.lineWidth=2.5;ctx.stroke();ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.lineTo(pts[6].x,pad.t+ch);ctx.lineTo(pts[0].x,pad.t+ch);ctx.closePath();let grad=ctx.createLinearGradient(0,pad.t,0,h);grad.addColorStop(0,'rgba(99,116,239,.20)');grad.addColorStop(1,'rgba(99,116,239,0)');ctx.fillStyle=grad;ctx.fill();pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,Math.PI*2);ctx.fillStyle='#6374ef';ctx.fill();ctx.fillStyle='#8b96a8';ctx.fillText(dates[i].slice(5),p.x-13,h-7)})}
window.addEventListener('resize',()=>{if(page==='dashboard')drawChart()});render();
</script></body></html>
